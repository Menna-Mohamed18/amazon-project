<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heart</title>
  <style>
    .heart{
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      background-color: red;
      transform: translate(50%,50%);
    }
    .heart2{
      position: absolute;
      top: 50%;
      right: 50%;
      width: 100px;
      height: 100px;
      background-color:black;
    }
  </style>
</head>
<body>
  <div class="heart">fdaj;jdk
  </div>
  <div class="heart2"></div>
  <div style="background-color: yellow;width:683px">fdakfld</div>
</body>
</html>
